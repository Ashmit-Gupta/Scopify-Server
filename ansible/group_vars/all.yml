# group_vars/all.yml — shared by all Scopify Server hosts

ansible_user: ubuntu
ansible_python_interpreter: auto_silent

# ─── Align with terraform.tfvars ──────────────────────────────────────────────
project_name: "scopify-cluster"
aws_region: "ap-south-1"
vpc_cidr: "10.20.0.0/16"

# Domain / edge (Squarespace → Nginx EIP)
edge_domain: "ashmit.xyz"
jenkins_hostname: "jenkins.ashmit.xyz"
sonar_hostname: "sonar.ashmit.xyz"
nexus_hostname: "nexus.ashmit.xyz"
k8s_dev_hostname: "dev.ashmit.xyz"
k8s_aws_api_hostname: "aws-api.ashmit.xyz"
k8s_argocd_hostname: "argocd.ashmit.xyz"

# Timezone for all long-running Docker containers (Jenkins / Sonar / Nexus / Nginx)
container_timezone: "Asia/Kolkata"

# ─── Kubernetes version bundle (mutually compatible — Jul 2026) ───────────────
# K8s has no classic LTS; supported minors today: 1.36 / 1.35 / 1.34.
#
# Absolute newest K8s = 1.36.x, BUT community ingress-nginx was retired (Mar 2026);
# its FINAL release is controller-v1.15.1 and was only CI-tested through K8s 1.35.
# So the latest *compatible* bundle is:
#   kubeadm/kubelet/kubectl  1.35.6
#   Calico                   v3.29.4  (avoids v3.32 ClusterNetworkPolicy isCIDR CEL break)
#   Ingress-Nginx            controller-v1.15.1  (networking.k8s.io/v1 — NOT v0.49)
#   Helm + aws-ebs-csi-driver + StorageClass gp3 (PVC support)
#
# DO NOT use controller-v0.49 — it still watches *v1beta1.Ingress and CrashLoops on
# any modern cluster (exactly the Failed to watch *v1beta1.Ingress error).
#
# WARNING: Changing these alone does NOT upgrade nodes already at an older minor
# (e.g. workers stuck on 1.28). Re-run site.yml so roles/common installs+holds
# the pins below and ASSERTs `kubelet --version` matches kubernetes_version.

kubernetes_version: "1.35.6"
kubeadm_pkg_version: "1.35.6-1.1"
kubelet_pkg_version: "1.35.6-1.1"
kubectl_pkg_version: "1.35.6-1.1"

kubernetes_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v1.35/deb/Release.key"
kubernetes_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.35/deb/ /"

pod_network_cidr: "10.244.0.0/16"

k8s_sysctl_settings:
  - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
  - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
  - { name: net.ipv4.ip_forward, value: "1" }

k8s_kernel_modules:
  - br_netfilter
  - overlay

# Pin Calico. v3.32.x ships ClusterNetworkPolicy CRDs using CEL isCIDR() which
# fails apply on API servers without the K8s 1.31+ IP/CIDR CEL libraries
# (error: undeclared reference to 'isCIDR'). v3.29.x avoids that CRD.
calico_version: "v3.29.4"
calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"

# Pin Ingress-Nginx (old v0.49 was for K8s ≤1.18). Baremetal = NodePort on kubeadm VMs.
ingress_nginx_version: "controller-v1.15.1"
ingress_nginx_manifest_url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/{{ ingress_nginx_version }}/deploy/static/provider/baremetal/deploy.yaml"

# ─── Helm + AWS EBS CSI (PVC → gp3) — installed on Master by roles/master ─────
helm_version: "v3.17.3"
ebs_csi_chart_version: "2.40.0"
ebs_csi_controller_replicas: 1
install_ebs_csi: true
