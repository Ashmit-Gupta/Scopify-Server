# group_vars/all.yml — every K8s node (master + workers)

ansible_user: ubuntu
ansible_python_interpreter: auto_silent

# Kubernetes version (kubeadm / kubelet / kubectl package pin)
kubernetes_version: "1.28.1"
kubeadm_pkg_version: "1.28.1-1.1"
kubelet_pkg_version: "1.28.1-1.1"
kubectl_pkg_version: "1.28.1-1.1"

kubernetes_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key"
kubernetes_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"

pod_network_cidr: "10.244.0.0/16"

k8s_sysctl_settings:
  - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
  - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
  - { name: net.ipv4.ip_forward, value: "1" }

k8s_kernel_modules:
  - br_netfilter
  - overlay

calico_manifest_url: "https://docs.projectcalico.org/manifests/calico.yaml"
ingress_nginx_manifest_url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v0.49.0/deploy/static/provider/baremetal/deploy.yaml"
