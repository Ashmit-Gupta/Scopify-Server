# Official nginx image — edge reverse proxy in Docker
nginx_image: "nginx:1.27-alpine"
nginx_container_name: "scopify-nginx"
nginx_http_port: 80
nginx_https_port: 443
nginx_config_dir: /opt/scopify-nginx/conf.d
nginx_memory: "256m"

# TLS — wildcard for ALL *.ashmit.xyz (+ apex) via Let's Encrypt DNS-01 (Cloudflare)
# Webroot cannot issue *. domains; Cloudflare API token is required.
nginx_enable_https: true
nginx_ssl_email: "ashmitg.dev@gmail.com"
nginx_letsencrypt_dir: /etc/letsencrypt
nginx_certbot_webroot: /opt/scopify-nginx/certbot
nginx_certbot_method: "dns-cloudflare"   # wildcard = DNS-01

# Cert live/ folder name + SANs (covers jenkins/sonar/nexus/test-k8s/api/…)
nginx_ssl_primary_hostname: "{{ edge_domain }}"   # ashmit.xyz
nginx_ssl_cert_path: "/etc/letsencrypt/live/{{ nginx_ssl_primary_hostname }}/fullchain.pem"
nginx_ssl_key_path: "/etc/letsencrypt/live/{{ nginx_ssl_primary_hostname }}/privkey.pem"
nginx_ssl_hostnames:
  - "{{ edge_domain }}"           # ashmit.xyz
  - "*.{{ edge_domain }}"         # *.ashmit.xyz

# Cloudflare API token (Zone:DNS:Edit for ashmit.xyz). Prefer secrets file:
#   ansible/group_vars/nginx_secrets.yml  (gitignored) — see nginx_secrets.yml.example
# cloudflare_dns_api_token: "…"   # set in nginx_secrets.yml only

nginx_cloudflare_credentials_path: /etc/letsencrypt/cloudflare.ini
# Re-issue when switching from old per-host cert → wildcard (set false after first success)
nginx_ssl_force_wildcard: true

# Backend ports (match terraform SGs + Docker publish ports on tool VMs)
jenkins_backend_port: 8080
sonar_backend_port: 9000
nexus_backend_port: 8081
