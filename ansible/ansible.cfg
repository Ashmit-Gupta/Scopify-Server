# ansible.cfg — run ansible-playbook from ansible/
#
# Custom VPC: private hosts have no public IP.
# Option A (default below): ProxyJump through Nginx when ANSIBLE_SSH_JUMP_HOST is set.
# Option B: SSM — see group_vars/private.yml
# Option C: run playbooks from inside the VPC (on Nginx).

[defaults]
inventory         = inventories/aws_ec2.yml
host_key_checking = False
retry_files_enabled = False
callbacks_enabled = timer, profile_tasks
deprecation_warnings = False
interpreter_python = auto_silent
timeout = 60

[ssh_connection]
pipelining = True
# When jumping via Nginx, export before playbooks:
#   export ANSIBLE_SSH_COMMON_ARGS='-o ProxyJump=ubuntu@<NGINX_PUBLIC_OR_EIP>'
# Or set per-run:
#   ansible-playbook site.yml -e 'ansible_ssh_common_args="-o ProxyJump=ubuntu@x.x.x.x"'
timeout = 60

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, script, auto, yaml, ini
