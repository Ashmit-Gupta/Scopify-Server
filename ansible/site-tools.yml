# ansible/site-tools.yml
# CI/CD tool VMs on PRIVATE subnet (custom VPC): Jenkins, SonarQube, Nexus
#
# Reach via ProxyJump (Nginx) or SSM — see cmds.md / group_vars/private.yml
# Ports (VPC-internal; Nginx proxies public hostnames later):
#   Jenkins  -> 8080, 50000
#   SonarQube -> 9000
#   Nexus    -> 8081
#
# Run AFTER site.yml if you only care about tools; BEFORE site-nginx.yml
# so upstreams are listening when the edge proxy is configured.

---
- name: Prepare CI/CD tool VMs (packages + Docker)
  hosts: tools
  become: yes
  gather_facts: yes
  serial: 1

  roles:
    - packages
    - docker

- name: Install Trivy and run Jenkins
  hosts: jenkins
  become: yes
  gather_facts: yes

  roles:
    - trivy
    - jenkins

- name: Install and run SonarQube
  hosts: sonar
  become: yes
  gather_facts: yes

  roles:
    - sonarqube

- name: Install and run Nexus
  hosts: nexus
  become: yes
  gather_facts: yes

  roles:
    - nexus
