# ansible/site-tools.yml
# CI/CD tool VMs on PRIVATE subnet (custom VPC): Jenkins, SonarQube, Nexus
#
# Reach via ProxyJump (Nginx) or SSM — see cmds.md / group_vars/private.yml
# Ports (VPC-internal; Nginx proxies public hostnames later):
#   Jenkins  -> 8080, 50000
#   SonarQube -> 9000
#   Nexus    -> 8081
#
# Run AFTER site.yml (cluster must exist — Jenkins copies Master kubeconfig).
# Run BEFORE site-nginx.yml so upstreams are listening when the edge proxy is configured.
#
# Jenkins CD extras (roles/jenkins):
#   - installs kubectl (same pin as group_vars/all.yml)
#   - copies /etc/kubernetes/admin.conf from Master → /opt/scopify-kube/config
#   - mounts kubectl + kubeconfig into the Jenkins container (KUBECONFIG=/kube/config)

---
- name: Prepare CI/CD tool VMs (packages + Docker)
  hosts: tools
  become: yes
  gather_facts: yes
  serial: 1

  roles:
    - packages
    - docker
    - ssm_login

- name: Install Trivy and run Jenkins
  hosts: jenkins
  become: yes
  gather_facts: yes

  roles:
    - trivy
    - jenkins

- name: Install and run SonarQube
  hosts: sonar
  become: yes
  gather_facts: yes

  roles:
    - sonarqube

- name: Install and run Nexus
  hosts: nexus
  become: yes
  gather_facts: yes

  roles:
    - nexus
