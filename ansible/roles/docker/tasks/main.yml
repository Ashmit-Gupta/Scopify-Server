---
# roles/docker — install Docker and enable auto-start on boot

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - containerd
    state: present
    update_cache: yes

- name: Enable and start containerd (required by Docker)
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true

- name: Enable and start Docker on boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Enable docker.socket if present
  ansible.builtin.systemd:
    name: docker.socket
    state: started
    enabled: true
  failed_when: false

- name: Allow non-root access to Docker socket (lab)
  ansible.builtin.file:
    path: /var/run/docker.sock
    mode: "0666"

- name: Confirm Docker is available
  ansible.builtin.command: docker version
  register: docker_version
  changed_when: false

- name: Show Docker version
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout_lines | default(docker_version.stderr_lines) }}"
