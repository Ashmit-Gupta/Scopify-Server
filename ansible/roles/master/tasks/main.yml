# Steps 7–10 — Master node only
#
# Resilience against the common failure mode:
#   kubeadm init times out while installing CoreDNS → no ~/.kube/config → kubectl → :8080
#
# Strategy:
#   1) Pre-pull images (shorter init)
#   2) kubeadm init WITHOUT CoreDNS/kube-proxy addons
#   3) Copy kubeconfig for ubuntu ASAP
#   4) Wait until API answers
#   5) Install addons + Calico with retries
#   6) Verify kubectl works before finishing

---
- name: Install master-only utilities
  ansible.builtin.apt:
    name: "{{ master_extra_packages }}"
    state: present
    update_cache: true
  when: master_extra_packages | default([]) | length > 0

- name: Load kernel modules required by Kubernetes
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_kernel_modules }}"

- name: Apply Kubernetes sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ k8s_sysctl_settings }}"

- name: Ensure containerd and kubelet are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - containerd
    - kubelet

- name: Check if admin.conf already exists
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

- name: Check if API is already listening (partial vs healthy)
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 5
  register: api_already_up
  ignore_errors: true
  when: k8s_admin_conf.stat.exists

- name: Fail clearly on broken partial init (admin.conf present, API down)
  ansible.builtin.fail:
    msg: >
      Found /etc/kubernetes/admin.conf but the API on :6443 is not up.
      This is a broken partial kubeadm init. On Master run:
        sudo kubeadm reset -f
        sudo rm -rf /etc/cni/net.d /var/lib/etcd
        sudo systemctl restart containerd kubelet
      Then re-run: ansible-playbook site.yml --limit master
  when:
    - k8s_admin_conf.stat.exists
    - api_already_up is failed

- name: Pre-pull Kubernetes control-plane images
  ansible.builtin.command: "kubeadm config images pull --kubernetes-version=v{{ kubernetes_version }}"
  when: not k8s_admin_conf.stat.exists
  register: image_pull
  retries: 3
  delay: 20
  until: image_pull.rc == 0
  changed_when: true

- name: Initialize Kubernetes master (control plane only, no DNS/proxy addons)
  ansible.builtin.command: >
    kubeadm init
    --kubernetes-version=v{{ kubernetes_version }}
    --pod-network-cidr={{ pod_network_cidr }}
    --skip-phases=addon/coredns,addon/kube-proxy
  when: not k8s_admin_conf.stat.exists
  register: kubeadm_init
  async: 900
  poll: 15

- name: Show kubeadm init output
  ansible.builtin.debug:
    var: kubeadm_init.stdout_lines
  when: kubeadm_init is changed

- name: Re-check admin.conf after init
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

- name: Fail if control plane files were not created
  ansible.builtin.fail:
    msg: >
      kubeadm init did not create /etc/kubernetes/admin.conf.
      On Master: sudo kubeadm reset -f && sudo systemctl restart containerd kubelet
      Then re-run ansible-playbook site.yml --limit master
  when: not k8s_admin_conf.stat.exists

- name: Ensure .kube directory exists for {{ kubeconfig_user }}
  ansible.builtin.file:
    path: "/home/{{ kubeconfig_user }}/.kube"
    state: directory
    owner: "{{ kubeconfig_user }}"
    group: "{{ kubeconfig_user }}"
    mode: "0755"

- name: Copy admin kubeconfig to user home (fixes kubectl localhost:8080)
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_path }}"
    remote_src: yes
    owner: "{{ kubeconfig_user }}"
    group: "{{ kubeconfig_user }}"
    mode: "0600"

- name: Wait until Kubernetes API port is open
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    delay: 5
    timeout: 300

- name: Wait until API server answers kubectl
  become: yes
  become_user: "{{ kubeconfig_user }}"
  ansible.builtin.command: kubectl get --raw=/readyz
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: api_ready
  retries: 30
  delay: 10
  until: api_ready.rc == 0
  changed_when: false

- name: Install CoreDNS addon
  ansible.builtin.command: kubeadm init phase addon coredns
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: coredns_addon
  retries: 8
  delay: 20
  until: coredns_addon.rc == 0
  changed_when: coredns_addon.rc == 0

- name: Install kube-proxy addon
  ansible.builtin.command: kubeadm init phase addon kube-proxy
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kube_proxy_addon
  retries: 8
  delay: 20
  until: kube_proxy_addon.rc == 0
  changed_when: kube_proxy_addon.rc == 0

- name: Deploy Calico CNI
  become: yes
  become_user: "{{ kubeconfig_user }}"
  ansible.builtin.command: "kubectl apply -f {{ calico_manifest_url }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: calico_apply
  retries: 5
  delay: 15
  until: >
    (calico_apply.rc == 0)
    or
    (
      ('daemonset.apps/calico-node' in (calico_apply.stdout | default('')))
      and
      ('isCIDR' in (calico_apply.stderr | default('')))
    )
  # Core CNI can succeed while optional ClusterNetworkPolicy CRD fails (isCIDR CEL)
  failed_when: >
    (calico_apply.rc != 0)
    and
    ('daemonset.apps/calico-node' not in (calico_apply.stdout | default('')))
  changed_when: "'created' in (calico_apply.stdout | default('')) or 'configured' in (calico_apply.stdout | default(''))"

- name: Warn if Calico applied with skipped ClusterNetworkPolicy CRD
  ansible.builtin.debug:
    msg: >
      Calico core components applied; ClusterNetworkPolicy CRD failed (isCIDR CEL).
      Pod networking still works. Prefer calico_version v3.29.x in group_vars/all.yml.
  when:
    - calico_apply.rc is defined
    - calico_apply.rc != 0
    - "'isCIDR' in (calico_apply.stderr | default(''))"

# Old controller-v0.49 watches extensions/v1beta1 Ingress → CrashLoop on K8s ≥1.22.
# Always replace namespace so a bad install cannot linger beside the new manifest.
- name: Remove previous Ingress-Nginx namespace (clears CrashLoop / API mismatch leftovers)
  become: yes
  become_user: "{{ kubeconfig_user }}"
  ansible.builtin.command: >
    kubectl delete namespace ingress-nginx
    --ignore-not-found=true
    --wait=true
    --timeout=120s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: ingress_ns_delete
  changed_when: "'deleted' in ingress_ns_delete.stdout"
  failed_when: false

- name: Deploy NGINX Ingress Controller ({{ ingress_nginx_version }} — networking.k8s.io/v1)
  become: yes
  become_user: "{{ kubeconfig_user }}"
  ansible.builtin.command: "kubectl apply -f {{ ingress_nginx_manifest_url }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: ingress_apply
  retries: 5
  delay: 15
  until: ingress_apply.rc == 0
  changed_when: "'created' in ingress_apply.stdout or 'configured' in ingress_apply.stdout"

- name: Wait until Ingress Controller pods are Ready
  become: yes
  become_user: "{{ kubeconfig_user }}"
  ansible.builtin.command: >
    kubectl -n ingress-nginx wait
    --for=condition=Ready pod
    -l app.kubernetes.io/component=controller
    --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: ingress_ready
  retries: 3
  delay: 20
  until: ingress_ready.rc == 0
  changed_when: false

# Helm + EBS CSI + default gp3 StorageClass (PVCs for Postgres/Redis)
- name: Install Helm, AWS EBS CSI driver, and gp3 StorageClass
  ansible.builtin.include_tasks: storage.yml
  when: install_ebs_csi | default(true) | bool

- name: Verify kubectl works for {{ kubeconfig_user }}
  become: yes
  become_user: "{{ kubeconfig_user }}"
  ansible.builtin.command: kubectl get nodes
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: nodes_check
  retries: 12
  delay: 10
  until: nodes_check.rc == 0
  changed_when: false

- name: Show cluster nodes
  ansible.builtin.debug:
    var: nodes_check.stdout_lines

- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubeadm_join_command
  changed_when: false

- name: Confirm master setup complete
  ansible.builtin.debug:
    msg: >
      Master {{ inventory_hostname }} ready.
      kubectl works with {{ kubeconfig_path }}.
      Helm + EBS CSI + StorageClass gp3: {{ 'enabled' if (install_ebs_csi | default(true) | bool) else 'skipped' }}.
      Join command: {{ kubeadm_join_command.stdout }}
