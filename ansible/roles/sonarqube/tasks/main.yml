---
# roles/sonarqube — run SonarQube LTS community container
# Port: 9000 (UI). Requires vm.max_map_count for Elasticsearch.

- name: Set vm.max_map_count for SonarQube / Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    reload: yes

- name: Create SonarQube data volumes
  ansible.builtin.command: "docker volume create {{ item }}"
  loop:
    - sonarqube_data
    - sonarqube_extensions
    - sonarqube_logs
  changed_when: false

- name: Check if SonarQube container exists
  ansible.builtin.command: docker ps -a --format {% raw %}{{.Names}}{% endraw %}
  register: docker_names
  changed_when: false

- name: Start existing SonarQube container
  ansible.builtin.command: docker start sonarqube
  when: "'sonarqube' in docker_names.stdout_lines"
  failed_when: false

- name: Ensure SonarQube restarts when Docker/VM starts
  ansible.builtin.command: docker update --restart unless-stopped sonarqube
  when: "'sonarqube' in docker_names.stdout_lines"
  changed_when: true

- name: Run SonarQube container
  ansible.builtin.command: >
    docker run -d
    --name sonarqube
    --restart unless-stopped
    -p {{ sonar_http_port }}:9000
    -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    -v sonarqube_data:/opt/sonarqube/data
    -v sonarqube_extensions:/opt/sonarqube/extensions
    -v sonarqube_logs:/opt/sonarqube/logs
    {{ sonar_image }}
  when: "'sonarqube' not in docker_names.stdout_lines"

- name: Wait for SonarQube HTTP port
  ansible.builtin.wait_for:
    port: "{{ sonar_http_port }}"
    host: 127.0.0.1
    delay: 15
    timeout: 300

- name: Confirm SonarQube is up
  ansible.builtin.debug:
    msg: >
      SonarQube running on port {{ sonar_http_port }}.
      Open http://{{ ansible_host }}:{{ sonar_http_port }}
      Default login: admin / admin
