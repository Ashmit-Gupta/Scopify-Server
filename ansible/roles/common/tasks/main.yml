# Steps 1–6 — Master & Worker nodes

---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Disable swap (required for kubeadm)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Load kernel modules required by Kubernetes
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_kernel_modules }}"

- name: Persist Kubernetes kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "{{ k8s_kernel_modules | join('\n') }}\n"
    mode: "0644"

- name: Apply Kubernetes sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ k8s_sysctl_settings }}"

- name: Persist Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"

- name: Install container runtime packages
  ansible.builtin.apt:
    name:
      - containerd
      - docker.io
    state: present

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup for containerd (required by kubeadm)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  register: containerd_cgroup_fix

- name: Restart containerd after cgroup config change
  ansible.builtin.service:
    name: containerd
    state: restarted
  when: containerd_cgroup_fix.changed

- name: Ensure containerd is running and enabled on boot
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Ensure Docker is running and enabled on boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Allow access to Docker socket
  ansible.builtin.file:
    path: /var/run/docker.sock
    mode: "0666"

- name: Configure crictl to use containerd socket
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false


- name: Install Kubernetes apt dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Drop stale channels (e.g. leftover v1.28 list) so apt cannot pin old kubelet.
- name: Remove stale Kubernetes apt source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kubernetes.list
    - /etc/apt/sources.list.d/kubernetes.list.save
    - /etc/apt/sources.list.d/pkgs.k8s.io_core_stable_v1.28_deb.list
    - /etc/apt/sources.list.d/pkgs.k8s.io_core_stable_v1.29_deb.list
    - /etc/apt/sources.list.d/pkgs.k8s.io_core_stable_v1.30_deb.list
    - /etc/apt/sources.list.d/pkgs.k8s.io_core_stable_v1.31_deb.list
    - /etc/apt/sources.list.d/pkgs.k8s.io_core_stable_v1.32_deb.list
    - /etc/apt/sources.list.d/pkgs.k8s.io_core_stable_v1.33_deb.list
    - /etc/apt/sources.list.d/pkgs.k8s.io_core_stable_v1.34_deb.list

- name: Prepare non-interactive GPG home for apt keyring
  ansible.builtin.file:
    path: /tmp/ansible-gnupg-k8s
    state: directory
    mode: "0700"

- name: Remove previous Kubernetes apt keyring (allow rewrite)
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: absent

- name: Add Kubernetes GPG key (always refresh — channel upgrades need a fresh keyring)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL {{ kubernetes_apt_key_url }} \
      | gpg --batch --yes --no-tty --dearmor \
        -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    chmod 0644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    executable: /bin/bash
  environment:
    GNUPGHOME: /tmp/ansible-gnupg-k8s
  changed_when: true

- name: Add Kubernetes apt repository ({{ kubernetes_version }} channel)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "{{ kubernetes_apt_repo }}\n"
    mode: "0644"

- name: Refresh apt cache after adding Kubernetes repo
  ansible.builtin.apt:
    update_cache: yes

- name: Unhold Kubernetes packages before (re)install / version pin change
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubeadm
    - kubelet
    - kubectl
  failed_when: false

- name: Install Kubernetes components (pinned {{ kubernetes_version }})
  ansible.builtin.apt:
    name:
      - "kubeadm={{ kubeadm_pkg_version }}"
      - "kubelet={{ kubelet_pkg_version }}"
      - "kubectl={{ kubectl_pkg_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
  register: k8s_pkgs_install

- name: Hold Kubernetes packages at current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet
    - kubectl

# Leftover Docker-era flag crashes kubelet ≥1.27 (unknown flag: --pod-infra-container-image).
- name: Scrub removed kubelet flag --pod-infra-container-image
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '--pod-infra-container-image=\S+\s*'
    replace: ''
  loop:
    - /var/lib/kubelet/kubeadm-flags.env
    - /etc/default/kubelet
  failed_when: false
  register: kubelet_flag_scrub

- name: Restart kubelet after package / flag changes
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
    enabled: true
  when: k8s_pkgs_install.changed or (kubelet_flag_scrub.results | default([]) | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0)

- name: Read installed kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_version_check
  changed_when: false

- name: Fail if kubelet is not the pinned version {{ kubernetes_version }}
  ansible.builtin.assert:
    that:
      - ("v" ~ kubernetes_version) in kubelet_version_check.stdout
    fail_msg: >-
      {{ inventory_hostname }} has {{ kubelet_version_check.stdout | trim }} but
      group_vars pin Kubernetes {{ kubernetes_version }}. Fix apt repo / holds and re-run
      site.yml on this host (common role). Do not join workers on a different minor
      than the control plane.
    success_msg: "{{ inventory_hostname }} kubelet matches pin {{ kubernetes_version }}"

- name: Confirm common node setup
  ansible.builtin.debug:
    msg: "Node {{ inventory_hostname }} ready — Docker + Kubernetes {{ kubernetes_version }} packages installed (Calico {{ calico_version }}, Ingress {{ ingress_nginx_version }})."
