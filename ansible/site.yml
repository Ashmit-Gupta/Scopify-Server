# ansible/site.yml
# K8s 1.35.6 + Calico v3.32.1 + Ingress-Nginx v1.15.1 — PRIVATE subnet (custom VPC)
# Version pins: group_vars/all.yml
#
# Play 1: all K8s nodes → common role
# Play 2: master       → master role
# Play 3: workers      → workers role
#
# Access: ProxyJump via Nginx or SSM (see cmds.md)

---
- name: Prepare all Kubernetes nodes
  hosts: master:workers
  become: yes
  gather_facts: yes
  serial: 1

  roles:
    - common
    - ssm_login

- name: Initialize and configure Kubernetes master
  hosts: master
  become: yes
  gather_facts: yes

  roles:
    - master

- name: Join worker nodes to the cluster
  hosts: workers
  become: yes
  gather_facts: yes
  serial: 1

  roles:
    - workers

  post_tasks:
    - name: Cluster setup finished
      ansible.builtin.debug:
        msg: "Worker {{ inventory_hostname }} configuration complete."
