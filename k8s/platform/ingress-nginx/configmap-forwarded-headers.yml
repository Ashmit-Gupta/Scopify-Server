# Merge-patch for ingress-nginx-controller ConfigMap.
# Trust client IPs from the edge Nginx (VPC) so pods see the real public IP
# instead of the NodePort SNAT/worker address (e.g. 10.20.54.98).
#
# Apply (merge — does not wipe other ConfigMap keys):
#   kubectl -n ingress-nginx patch configmap ingress-nginx-controller \
#     --type merge --patch-file k8s/platform/ingress-nginx/configmap-forwarded-headers.yml
#   kubectl -n ingress-nginx rollout restart deployment/ingress-nginx-controller
#
# Docs: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/configmap/#use-forwarded-headers
data:
  # Accept X-Forwarded-* / X-Real-IP from the edge proxy (Nginx EC2)
  use-forwarded-headers: "true"
  compute-full-forwarded-for: "true"
  enable-real-ip: "true"
  # Trust proxies inside the Scopify VPC (edge Nginx → NodePort)
  proxy-real-ip-cidr: "10.20.0.0/16"
