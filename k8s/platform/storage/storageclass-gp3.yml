# Default StorageClass for Scopify kubeadm cluster (AWS EBS via CSI)
# Requires: aws-ebs-csi-driver installed + node IAM with AmazonEBSCSIDriverPolicy
# See README.md in this folder.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
