# Prisma migrate as an Argo CD PreSync hook — runs before Deployment rolls out.
# BeforeHookCreation deletes the previous Job so immutable template updates work.
# Docs: https://argo-cd.readthedocs.io/en/stable/user-guide/resource_hooks/
apiVersion: batch/v1
kind: Job
metadata:
  name: scopify-migrate
  namespace: scopify-dev
  labels:
    app: scopify-api
    component: migrate
    environment: dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: scopify-api
        component: migrate
        environment: dev
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/ashmit-gupta/scopify-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - npx
            - prisma
            - migrate
            - deploy
            - --config
            - prisma.config.ts
          envFrom:
            - secretRef:
                name: scopify-api-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
